<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold text-primary" routerLink="/">MMP</a>

    <button class="navbar-toggler" type="button"
      data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto align-items-lg-center">

        <li class="nav-item">
          <a class="nav-link" routerLink="/home" routerLinkActive="active">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/jobs" routerLinkActive="active">Jobs</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/companies" routerLinkActive="active">Companies</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#about">About</a>
        </li>

        <!-- NOT logged in -->
        @if(!isLoggedIn) {
          <li class="nav-item ms-lg-3">
            <a class="btn btn-outline-primary" routerLink="/login">Login</a>
          </li>
          <li class="nav-item ms-lg-2">
            <a class="btn btn-primary" routerLink="/register">Sign up</a>
          </li>

        <!-- Logged in -->
        @if(isLoggedIn) {

              href="#" role="button"
              data-bs-toggle="dropdown" aria-expanded="false">

              <span class="avatar-circle">

                  <i class="bi bi-box-arrow-right me-2"></i> Logout
                </a>
              </li>
            </ul>
          </li>

      </ul>
