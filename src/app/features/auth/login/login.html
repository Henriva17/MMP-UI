<app-navbar/>

<section class="min-vh-100 d-flex align-items-center bg-light py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-5">
        <div class="card border-0 shadow-sm rounded-4">
          <div class="card-body p-4 p-lg-5">

            <div class="text-center mb-4">
              <h2 class="fw-bold mb-2">Welcome back</h2>
              <p class="text-muted mb-0">Login to your account</p>
            </div>

            <form (ngSubmit)="onSubmit()" #loginForm="ngForm">

              <div class="mb-3">
                <label class="form-label fw-semibold">Email</label>
                <input
                  type="email"
                  class="form-control form-control-lg"
                  [class.is-invalid]="emailField.touched && emailField.invalid"
                  [(ngModel)]="email"
                  name="email"
                  #emailField="ngModel"
                  required
                  email/>
                <div class="invalid-feedback">
                  Please enter a valid email address.
                </div>
              </div>

              <div class="mb-4">
                <label class="form-label fw-semibold">Password</label>
                <input
                  type="password"
                  class="form-control form-control-lg"
                  [class.is-invalid]="passwordField.touched && passwordField.invalid"
                  [(ngModel)]="password"
                  name="password"
                  #passwordField="ngModel"
                  required/>
                <div class="invalid-feedback">
                  Password is required.
                </div>
              </div>

              @if(errorMessage) {
                <div class="alert alert-danger py-0 mb-2">
                  <i class="bi bi-exclamation-circle me-2"></i>{{ errorMessage }}
                </div>
              }

              <button type="submit" class="btn btn-primary btn-lg w-100"
                [disabled]="isLoading || loginForm.invalid">
                {{ isLoading ? 'Logging in...' : 'Login' }}
              </button>

            </form>

            <p class="text-center text-muted mt-4 mb-0">
              Don't have an account?
              <a routerLink="/register" class="fw-semibold text-decoration-none">Create one</a>
            </p>

          </div>
        </div>
      </div>
    </div>
  </div>
</section>

<app-footer/>
